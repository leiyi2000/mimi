services:
    napcat:
        env_file:
            - .env
        ports:
            - 3000:3000
            - 3001:3001
            - 6099:6099
        container_name: napcat
        restart: always
        image: mlikiowa/napcat-docker:latest
        volumes:
            - ./data/napcat/QQ:/app/.config/QQ
            - ./data/napcat/config:/app/napcat/config
            - ./data/napcat/plugins:/app/napcat/plugins
    ncm-api:
        container_name: ncm-api
        restart: always
        image: binaryify/netease_cloud_music_api:latest
        ports:
            - 3010:3000
    qimei:
        build: ./qimei
        container_name: qimei
        env_file:
            - .env
        restart: unless-stopped
        volumes:
            - ./data/qimei:/data
    mimi:
        build: .
        init: true
        stop_grace_period: 30s
        container_name: mimi
        env_file:
            - .env
        environment:
            PUMPKIN_CHAT_REASONING_EFFORT: medium
            PUMPKIN_TASK_REASONING_EFFORT: max
            PUMPKIN_CHAT_MAX_TOKENS: 4096
            PUMPKIN_TASK_MAX_TOKENS: 8192
            PUMPKIN_BROWSER_WORKER_SOCKET: /run/pumpkin-browser/control.sock
        restart: unless-stopped
        volumes:
            - ./data/mini/plugins/apex/data:/app/plugins/apex/data
            - ./data/mini/plugins/pumpkin/data:/app/plugins/pumpkin/data
            - ./data/mini/plugins/yasuo/data:/app/plugins/yasuo/data
            - ./data/mini/plugins/lol/data:/app/plugins/lol/data
            - pumpkin_browser_runtime:/run/pumpkin-browser
        depends_on:
            napcat:
                condition: service_started
            ncm-api:
                condition: service_started
            qimei:
                condition: service_started
        networks:
            - default
            - pumpkin_internal
    code-runner:
        build: ./plugins/pumpkin/sandbox
        container_name: mimi-code-runner
        restart: unless-stopped
        expose:
            - "8080"
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        pids_limit: 64
        mem_limit: 256m
        cpus: 1.0
        networks:
            pumpkin_internal:
                # Keep compatibility with the previous SANDBOX_URL=http://sandbox:8080.
                aliases:
                    - sandbox
    browser-worker:
        init: true
        stop_grace_period: 15s
        profiles:
            - browser
        build:
            context: ./plugins/pumpkin/browser
        container_name: mimi-browser-worker
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "python", "-m", "browser.worker", "--healthcheck"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s
        environment:
            BROWSER_WORKER_SOCKET: /run/pumpkin-browser/control.sock
            BROWSER_WORKER_TOKEN: ${PUMPKIN_BROWSER_WORKER_TOKEN:-disabled}
            BROWSER_WORKER_REQUEST_TIMEOUT_SECONDS: ${BROWSER_WORKER_REQUEST_TIMEOUT_SECONDS:-65}
            BROWSER_WORKER_NAVIGATION_TIMEOUT_SECONDS: ${PUMPKIN_BROWSER_NAVIGATION_TIMEOUT_SECONDS:-20}
            BROWSER_WORKER_ACTION_TIMEOUT_SECONDS: ${PUMPKIN_BROWSER_ACTION_TIMEOUT_SECONDS:-8}
            BROWSER_WORKER_LEASE_SECONDS: ${BROWSER_WORKER_LEASE_SECONDS:-900}
            BROWSER_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${BROWSER_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-30}
            BROWSER_WORKER_SDK_SOCKET_DIR: /run/pumpkin-browser-sdk
            BROWSER_CODE_RUNNER_SOCKET: /run/pumpkin-browser-sdk/runner.sock
            BROWSER_CODE_RUNNER_TOKEN: ${BROWSER_CODE_RUNNER_TOKEN:-}
        volumes:
            - pumpkin_browser_runtime:/run/pumpkin-browser
            - pumpkin_browser_sdk:/run/pumpkin-browser-sdk
        depends_on:
            browser-code-runner:
                condition: service_healthy
        tmpfs:
            - /tmp:size=256m,mode=1777
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        pids_limit: 128
        mem_limit: 1g
        cpus: 1.0
        networks:
            - browser_egress
    browser-code-runner:
        init: true
        stop_grace_period: 5s
        profiles:
            - browser
        build:
            context: ./plugins/pumpkin/browser
            dockerfile: Runner.Dockerfile
        container_name: mimi-browser-code-runner
        restart: unless-stopped
        network_mode: none
        environment:
            BROWSER_CODE_RUNNER_SOCKET: /run/pumpkin-browser-sdk/runner.sock
            BROWSER_WORKER_SDK_SOCKET_DIR: /run/pumpkin-browser-sdk
            BROWSER_CODE_RUNNER_TOKEN: ${BROWSER_CODE_RUNNER_TOKEN:-}
            BROWSER_CODE_RUNNER_MAX_OUTPUT_CHARS: ${BROWSER_CODE_RUNNER_MAX_OUTPUT_CHARS:-20480}
        volumes:
            - pumpkin_browser_sdk:/run/pumpkin-browser-sdk
        healthcheck:
            test: ["CMD", "python", "-m", "browser.code_runner", "--healthcheck"]
            interval: 10s
            timeout: 5s
            retries: 3
        tmpfs:
            - /tmp:size=64m,mode=1777
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        pids_limit: 16
        mem_limit: 256m
        cpus: 1.0

networks:
    pumpkin_internal:
    browser_egress:

volumes:
    pumpkin_browser_runtime:
    pumpkin_browser_sdk:
