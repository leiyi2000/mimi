services:
    napcat:
        env_file:
            - .env
        ports:
            - 3000:3000
            - 3001:3001
            - 6099:6099
        container_name: napcat
        restart: always
        image: mlikiowa/napcat-docker:latest
        volumes:
            - ./data/napcat/QQ:/app/.config/QQ
            - ./data/napcat/config:/app/napcat/config
            - ./data/napcat/plugins:/app/napcat/plugins
    ncm-api:
        container_name: ncm-api
        restart: always
        image: binaryify/netease_cloud_music_api:latest
        ports:
            - 3010:3000
    qimei:
        build: ./qimei
        container_name: qimei
        env_file:
            - .env
        restart: unless-stopped
        volumes:
            - ./data/qimei:/data
    mimi:
        build: .
        container_name: mimi
        env_file:
            - .env
        environment:
            PUMPKIN_CHAT_REASONING_EFFORT: medium
            PUMPKIN_TASK_REASONING_EFFORT: max
            PUMPKIN_CHAT_MAX_TOKENS: 4096
            PUMPKIN_TASK_MAX_TOKENS: 8192
            PUMPKIN_BROWSER_WORKER_SOCKET: /run/pumpkin-browser/control.sock
        restart: unless-stopped
        volumes:
            - ./data/mini/plugins/apex/data:/app/plugins/apex/data
            - ./data/mini/plugins/pumpkin/data:/app/plugins/pumpkin/data
            - ./data/mini/plugins/yasuo/data:/app/plugins/yasuo/data
            - ./data/mini/plugins/lol/data:/app/plugins/lol/data
            - pumpkin_browser_runtime:/run/pumpkin-browser
        depends_on:
            napcat:
                condition: service_started
            ncm-api:
                condition: service_started
            qimei:
                condition: service_started
        networks:
            - default
            - pumpkin_internal
    code-runner:
        build: ./plugins/pumpkin/sandbox
        container_name: mimi-code-runner
        restart: unless-stopped
        expose:
            - "8080"
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        pids_limit: 64
        mem_limit: 256m
        cpus: 1.0
        networks:
            pumpkin_internal:
                # Keep compatibility with the previous SANDBOX_URL=http://sandbox:8080.
                aliases:
                    - sandbox
    browser-worker:
        profiles:
            - browser
        build:
            context: ./plugins/pumpkin/browser
        container_name: mimi-browser-worker
        restart: unless-stopped
        environment:
            BROWSER_WORKER_SOCKET: /run/pumpkin-browser/control.sock
            BROWSER_WORKER_TOKEN: ${PUMPKIN_BROWSER_WORKER_TOKEN:-disabled}
        volumes:
            - pumpkin_browser_runtime:/run/pumpkin-browser
        tmpfs:
            - /tmp:size=256m,mode=1777
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        pids_limit: 64
        mem_limit: 1g
        cpus: 1.0
        networks:
            - browser_egress

networks:
    pumpkin_internal:
    browser_egress:

volumes:
    pumpkin_browser_runtime:
