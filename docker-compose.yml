services:
    napcat:
        env_file:
            - .env
        ports:
            - 3000:3000
            - 3001:3001
            - 6099:6099
        container_name: napcat
        restart: always
        image: mlikiowa/napcat-docker:latest
        volumes:
            - ./data/napcat/QQ:/app/.config/QQ
            - ./data/napcat/config:/app/napcat/config
            - ./data/napcat/plugins:/app/napcat/plugins
    mimi-init:
        build: .
        container_name: mimi-init
        volumes:
            - ./data/mini/plugins:/app/plugins
        entrypoint: [ "sh", "-c", "cp -r /app/plugins-from-image/. /app/plugins/ || true" ]
    mimi:
        build: .
        container_name: mimi
        env_file:
            - .env
        restart: unless-stopped
        volumes:
            - ./data/mini/plugins:/app/plugins
        depends_on:
            napcat:
                condition: service_started
            mimi-init:
                condition: service_completed_successfully
