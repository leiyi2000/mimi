[project]
name = "pumpkin"
version = "0.1.0"
description = "AI virtual task plugin for Mimi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.28.1",
    "markdown-it-py>=4.0.0",
    "napcat-sdk>=0.6.8",
    "pytakumi>=0.1.4",
    "python-dotenv>=1.2.2",
    "tortoise-orm>=1.1.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
