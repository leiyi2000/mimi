[project]
name = "niu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "napcat-sdk>=0.6.8",
    "anthropic>=0.40.0",
    "httpx>=0.28.1",
    "pillow>=12.0.0",
    "pyyaml>=6.0.3",
    "pydantic-monty==1.1.0",
    "pytakumi>=0.1.4",
]

[tool.ruff.lint]
ignore = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
