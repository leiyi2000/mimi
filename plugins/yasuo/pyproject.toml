[project]
name = "yasuo"
version = "0.1.0"
description = "Group message archive and recalled-message poster plugin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "napcat-sdk>=0.6.8",
    "pillow>=12.0.0",
    "pytakumi>=0.1.4",
    "tortoise-orm>=1.1.7",
    "uvicorn>=0.44.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
